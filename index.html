<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kofinisu — GitHub & Links</title>
<meta name="description" content="Projects, repos and social links." />
<style>
  /* ============ THEME TOKENS ============ */
  :root {
    --g1: #2b0b45;
    --g2: #4c1d95;
    --g3: #7c3aed;
    --g4: #c4a1f5;

    --text: #f6f1ff;
    --text-dim: #c3b0dd;
    --card: rgba(255, 255, 255, 0.07);
    --card-hover: rgba(255, 255, 255, 0.14);
    --border: rgba(255, 255, 255, 0.14);
    --border-strong: rgba(255, 255, 255, 0.30);
    --shadow: 0 10px 34px rgba(0, 0, 0, 0.35);
    --accent: #d8b4fe;
    --btn-bg: rgba(255, 255, 255, 0.10);
  }

  [data-theme="light"] {
    --g1: #a97ce0;
    --g2: #e8d8fb;
    --g3: #c9a4f0;
    --g4: #f7f1ff;

    --text: #2a0f45;
    --text-dim: #5c4479;
    --card: rgba(255, 255, 255, 0.55);
    --card-hover: rgba(255, 255, 255, 0.80);
    --border: rgba(90, 50, 150, 0.16);
    --border-strong: rgba(90, 50, 150, 0.32);
    --shadow: 0 10px 30px rgba(80, 40, 140, 0.15);
    --accent: #6b21a8;
    --btn-bg: rgba(255, 255, 255, 0.55);
  }

  /* ============ BASE ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: color 0.4s ease;
    overflow-x: hidden;
  }

  /* ============ ANIMATED DIAGONAL GRADIENT ============ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 35%, var(--g3) 70%, var(--g4) 100%);
    background-size: 300% 300%;
    animation: drift 20s ease-in-out infinite;
    transition: background 0.5s ease;
  }

  @keyframes drift {
    0%   { background-position:   0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position:   0% 50%; }
  }

  /* soft glow overlay for depth */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(60% 50% at 15% 10%, rgba(255, 255, 255, 0.18), transparent 65%),
      radial-gradient(50% 50% at 90% 90%, rgba(255, 255, 255, 0.10), transparent 70%);
  }
  [data-theme="light"] body::after {
    background:
      radial-gradient(60% 50% at 15% 10%, rgba(255, 255, 255, 0.55), transparent 65%),
      radial-gradient(50% 50% at 90% 90%, rgba(255, 255, 255, 0.35), transparent 70%);
  }

  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ============ LAYOUT ============ */
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 96px 22px 80px;
  }

  /* ============ THEME TOGGLE ============ */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 50;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--btn-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, background 0.3s ease, border-color 0.3s ease;
  }
  .theme-toggle:hover { transform: scale(1.1) rotate(12deg); }
  .theme-toggle:active { transform: scale(0.95); }
  .theme-toggle svg { width: 21px; height: 21px; transition: opacity 0.3s, transform 0.4s; }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="light"] .theme-toggle .icon-sun { display: block; }
  [data-theme="light"] .theme-toggle .icon-moon { display: none; }

  /* ============ HERO ============ */
  .hero {
    text-align: center;
    padding: 44px 26px 40px;
    border-radius: 26px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 108px;
    height: 108px;
    margin: 0 auto 20px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, #a855f7, #e9d5ff, #7c3aed);
    box-shadow: 0 6px 26px rgba(124, 58, 237, 0.45);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #2b0b45;
  }

  .hero h1 {
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    letter-spacing: -0.02em;
    font-weight: 800;
    line-height: 1.15;
  }

  .handle {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.95rem;
    color: var(--text-dim);
    font-weight: 500;
  }

  .bio {
    max-width: 540px;
    margin: 16px auto 0;
    color: var(--text-dim);
    font-size: 1.02rem;
  }

  /* ============ SOCIAL LINKS ============ */
  .socials {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 28px;
  }

  .social {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .social:hover {
    transform: translateY(-4px) scale(1.06);
    background: var(--card-hover);
    border-color: var(--border-strong);
    box-shadow: 0 10px 24px rgba(124, 58, 237, 0.32);
  }
  .social svg { width: 21px; height: 21px; }

  /* ============ SECTION ============ */
  .section {
    margin-top: 62px;
    animation: rise 0.7s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .section-head h2 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-head h2::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }

  .section-head a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: color 0.2s;
  }
  .section-head a:hover { color: var(--text); }

  /* ============ REPO GRID ============ */
  .repo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
    gap: 16px;
  }

  .repo {
    display: flex;
    flex-direction: column;
    padding: 20px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: inherit;
    text-decoration: none;
    box-shadow: var(--shadow);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
                background 0.25s, border-color 0.25s, box-shadow 0.25s;
    animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .repo:hover {
    transform: translateY(-6px);
    background: var(--card-hover);
    border-color: var(--border-strong);
    box-shadow: 0 18px 40px rgba(124, 58, 237, 0.30);
  }

  .repo-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 8px;
  }
  .repo-head svg {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    color: var(--text-dim);
  }
  .repo-head h3 {
    font-size: 1.02rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    word-break: break-word;
  }

  .repo-desc {
    font-size: 0.88rem;
    color: var(--text-dim);
    flex: 1;
    margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .repo-desc.empty { opacity: 0.55; font-style: italic; }

  .repo-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 0.79rem;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .repo-meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .repo-meta svg { width: 13px; height: 13px; }

  .lang-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  /* ============ SKELETON / STATUS ============ */
  .skeleton {
    height: 168px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .skeleton::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }

  .status {
    padding: 22px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.92rem;
    text-align: center;
    grid-column: 1 / -1;
  }
  .status a { color: var(--accent); font-weight: 600; }

  .notice {
    grid-column: 1 / -1;
    font-size: 0.8rem;
    color: var(--text-dim);
    opacity: 0.8;
    text-align: center;
    padding-top: 4px;
  }

  /* ============ FOOTER ============ */
  footer {
    margin-top: 72px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--text-dim);
    opacity: 0.85;
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--border-strong); }
  footer a:hover { color: var(--text); }

  @media (max-width: 520px) {
    .wrap { padding-top: 78px; }
    .hero { padding: 34px 18px 30px; border-radius: 22px; }
    .avatar { width: 88px; height: 88px; }
    .social { width: 44px; height: 44px; border-radius: 12px; }
  }
</style>
</head>
<body>

  <!-- ============ REPOS ============ -->
  <section class="section">

<script>

const GITHUB_USERNAME = "kofinisu";

/* How many repos to show */
const MAX_REPOS = 4;

/* Set to true to include forked repos */
const INCLUDE_FORKS = false;

/* =====================================================================
   Theme toggle (persisted in localStorage)
   ===================================================================== */
(function initTheme() {
  const root = document.documentElement;
  const btn = document.getElementById("themeToggle");

  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}

  const prefersLight = window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: light)").matches;

  root.setAttribute("data-theme", saved || (prefersLight ? "light" : "dark"));

  btn.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });
})();

/* =====================================================================
   Helpers
   ===================================================================== */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

const LANG_COLORS = {
  JavaScript: "#f1e05a", TypeScript: "#3178c6", Python: "#3572A5",
  HTML: "#e34c26", CSS: "#563d7c", SCSS: "#c6538c", Java: "#b07219",
  "C++": "#f34b7d", C: "#555555", "C#": "#178600", Go: "#00ADD8",
  Rust: "#dea584", Ruby: "#701516", PHP: "#4F5D95", Swift: "#F05138",
  Kotlin: "#A97BFF", Shell: "#89e051", Vue: "#41b883", Svelte: "#ff3e00",
  Dart: "#00B4AB", "Jupyter Notebook": "#DA5B0B", Lua: "#000080",
  Elixir: "#6e4a7e", Haskell: "#5e5086", Zig: "#ec915c", Nix: "#7e7eff",
  Astro: "#ff5a03", MDX: "#fcb32c"
};
const langColor = (l) => LANG_COLORS[l] || "#9b8ec4";

const fmt = (n) => n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : n;

/* =====================================================================
   Render
   ===================================================================== */
const ICON_REPO = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>';
const ICON_STAR = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>';
const ICON_FORK = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>';

const grid = document.getElementById("repoGrid");

function renderRepos(repos, noticeText) {
  grid.innerHTML = "";

  if (!repos.length) {
    grid.innerHTML = '<div class="status">No public repositories found yet. ' +
      '<a href="https://github.com/' + esc(GITHUB_USERNAME) + '" target="_blank" rel="noopener noreferrer">Visit GitHub →</a></div>';
    return;
  }

  repos.forEach((repo, i) => {
    const a = document.createElement("a");
    a.className = "repo";
    a.href = repo.html_url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.animationDelay = i * 55 + "ms";

    const desc = repo.description
      ? esc(repo.description)
      : "No description provided.";

    const langHtml = repo.language
      ? '<span><i class="lang-dot" style="background:' + langColor(repo.language) + '"></i>' + esc(repo.language) + "</span>"
      : "";

    const starsHtml = repo.stargazers_count > 0
      ? "<span>" + ICON_STAR + fmt(repo.stargazers_count) + "</span>"
      : "";

    const forksHtml = repo.forks_count > 0
      ? "<span>" + ICON_FORK + fmt(repo.forks_count) + "</span>"
      : "";

    a.innerHTML =
      '<div class="repo-head">' + ICON_REPO + "<h3>" + esc(repo.name) + "</h3></div>" +
      '<p class="repo-desc' + (repo.description ? "" : " empty") + '">' + desc + "</p>" +
      '<div class="repo-meta">' + langHtml + starsHtml + forksHtml + "</div>";

    grid.appendChild(a);
  });

  if (noticeText) {
    const n = document.createElement("p");
    n.className = "notice";
    n.textContent = noticeText;
    grid.appendChild(n);
  }
}

/* =====================================================================
   Fetch from GitHub API (with graceful fallback)
   ===================================================================== */
const SAMPLE_REPOS = [
  { name: "awesome-project", html_url: "#", description: "A delightful open-source project that does something genuinely useful.", language: "TypeScript", stargazers_count: 342, forks_count: 48 },
  { name: "tiny-library", html_url: "#", description: "A zero-dependency micro-library. Small enough to read in one sitting.", language: "JavaScript", stargazers_count: 128, forks_count: 12 },
  { name: "cli-tool", html_url: "#", description: "Command line utility for automating the boring stuff.", language: "Rust", stargazers_count: 89, forks_count: 7 },
  { name: "portfolio", html_url: "#", description: "Personal site and blog, built from scratch.", language: "Astro", stargazers_count: 41, forks_count: 9 },
  { name: "api-playground", html_url: "#", description: "Experimenting with APIs, webhooks and everything in between.", language: "Python", stargazers_count: 23, forks_count: 3 },
  { name: "dotfiles", html_url: "#", description: "My configuration files. Steal freely.", language: "Shell", stargazers_count: 15, forks_count: 2 }
];

async function loadRepos() {
  const apiUrl = "https://api.github.com/users/" +
    encodeURIComponent(GITHUB_USERNAME) + "/repos?per_page=100&sort=updated";

  try {
    const res = await fetch(apiUrl, { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error("GitHub API responded " + res.status);

    let repos = await res.json();
    if (!Array.isArray(repos)) throw new Error("Unexpected response");

    repos = repos
      .filter((r) => (INCLUDE_FORKS ? true : !r.fork))
      .sort((a, b) =>
        b.stargazers_count - a.stargazers_count ||
        new Date(b.pushed_at) - new Date(a.pushed_at)
      )
      .slice(0, MAX_REPOS);

    renderRepos(repos);

    // Set avatar from GitHub if we got here
    if (repos.length) {
      const owner = repos[0].owner || {};
      if (owner.avatar_url) document.getElementById("avatar").src = owner.avatar_url;
    }
  } catch (err) {
    renderRepos(SAMPLE_REPOS,
      ":3");
  }
}

/* Update links to point at the real username */
(function updateLinks() {
  document.getElementById("allReposLink").href =
    "https://github.com/" + GITHUB_USERNAME + "?tab=repositories";
  document.getElementById("avatar").src =
    "https://github.com/" + GITHUB_USERNAME + ".png?size=200";
  document.getElementById("avatar").onerror = function () {
    this.onerror = null;
    this.src = "https://github.com/github.png";
  };
})();

loadRepos();
</script>
</body>
